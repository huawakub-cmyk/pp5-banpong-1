<script>
const D={"meta":{"school":"บ้านโป่งวิทยาคม","year":"2568","class":"ประถมศึกษาปีที่ 6/1","code":"ท 16101","subject":"ภาษาไทย","teacher":"นางนวลจันทร์ กลอยสวาท"},"an":["รักชาติ ศาสน์ กษัตริย์","ซื่อสัตย์สุจริต","มีวินัย","ใฝ่เรียนรู้","อยู่อย่างพอเพียง","มุ่งมั่นในการทำงาน","รักความเป็นไทย","มีจิตสาธารณะ"],"cn":["ความสามารถในการสื่อสาร","ความสามารถในด้านการคิด","ความสามารถในการแก้ปัญหา","ความสามารถในการใช้ทักษะชีวิต","ความสามารถในการใช้เทคโนโลยี"],"users":[["admin","727ac8c9c3ef3c9b341b9c37b6a4a399b3018ef9734a47691395b05d8897b28c","admin","นายอันวา ตาเห"]],"st":[],"ind":[],"sc":[],"attr":[],"comp":[],"rd":[]},M=D.meta,K='pp5-th-p6-1';let S=D.sc.map(r=>r.slice()),view='cv',term=0,q='';

const save=()=>persist();
const gr=p=>p>=80?4:p>=75?3.5:p>=70?3:p>=65?2.5:p>=60?2:p>=55?1.5:p>=50?1:0;
let IN=D.ind,MAX=0;const setIN=a=>{IN=a;MAX=a.reduce((s,x)=>s+(+x.m||10),0)},mxs=t=>IN.filter(x=>!t||x.t==t).reduce((a,x)=>a+x.m,0);
const tot=(i,t)=>S[i].reduce((a,v,j)=>a+((v!=null&&v!==''&&(!t||IN[j].t==t))?+v:0),0);

document.getElementById('h').textContent=`ปพ.5 ${M.subject} ${M.code} · ${M.class}`;
document.getElementById('s').textContent=`โรงเรียน${M.school} · ปีการศึกษา ${M.year} · ครูผู้สอน ${M.teacher}`;
const $=s=>document.querySelector(s),m=$('#m');
function render(){
 if(view=='rs')return rrs();if(view=='hs')return rhs();if(view=='hm')return rhm();if(view=='um')return rum();if(VW[view])return rv();if(view=='cv')return rcv();if(view=='pr')return rpr();if(view=='ov')return rov();if(view=='sc')return rsc();if(view=='sm')return rsm();rin()}
function rsc(){
 if(!IN.length){m.innerHTML='<p>รายวิชานี้ยังไม่มีตัวชี้วัด ไปที่แท็บ "หน้าปก" กรอกรหัสวิชา+ชั้น (ระบบจะดึงตัวชี้วัดให้) หรือแท็บ "ตัวชี้วัด" เพื่อนำเข้าจากไฟล์ Excel</p>';return}
 if(!D.st.length){m.innerHTML='<p>ยังไม่มีรายชื่อนักเรียน ไปที่แท็บ "หน้าปก" แล้วเลือกปีการศึกษา ชั้น และห้อง (ผู้ดูแลต้องนำเข้ารายชื่อห้องนั้นไว้ก่อน)</p>';return}
 const cols=IN.map((x,j)=>[x,j]).filter(([x])=>!term||x.t==term);
 m.innerHTML=`<div class="bar"><input id="q" placeholder="ค้นหาชื่อนักเรียน" value="${q}"><select id="tm"><option value="0">ทั้งปี</option><option value="1">ภาคเรียนที่ 1</option><option value="2">ภาคเรียนที่ 2</option></select><button class="pri" id="xd">ดาวน์โหลดฟอร์มคะแนน (Excel)</button><button class="pri" id="xi">นำเข้าคะแนนจากไฟล์</button><span class="t">บันทึกอัตโนมัติ · เขียว ≥ 80% · เหลือง 50–79% · แดง &lt; 50% ของคะแนนเต็ม</span></div>
 <div class="wrap"><table><thead><tr><th class="nm">ชื่อ-สกุล</th>${cols.map(([x])=>`<th class="th${x.t}" title="${x.d}">${x.c}<div class="t">${x.s} · ภาค ${x.t}</div></th>`).join('')}<th>รวม</th></tr></thead><tbody>${D.st.map((s,i)=>s[1].includes(q)?`<tr><td class="nm"><span class="mu">${i+1}</span> ${s[1]}</td>${cols.map(([x,j])=>`<td><input type="number" min="0" max="${x.m}" data-i="${i}" data-j="${j}" value="${S[i][j]??''}" class="${sc(S[i][j],x.m)}"></td>`).join('')}<td><b id="t${i}">${tot(i,term)}</b></td></tr>`:'').join('')}</tbody></table></div>`;
 $('#tm').value=term;$('#tm').onchange=e=>{term=+e.target.value;rsc()};$('#xd').onclick=dlForm;$('#xi').onclick=()=>$('#fi4').click();$('#q').oninput=e=>{q=e.target.value;rsc();const n=$('#q');n.focus();n.setSelectionRange(q.length,q.length)};
}
const toast=msg=>{const b=$('#toast');b.textContent=msg;b.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>{b.hidden=true},4000)};
m.addEventListener('input',e=>{const t=e.target;if(!t.dataset.j)return;const i=+t.dataset.i,j=+t.dataset.j,mx2=+IN[j].m||10,raw=t.value;
 if(raw===''){S[i][j]=null;t.className='';$('#t'+i).textContent=tot(i,term);save();return}
 const n=+raw;if(isNaN(n)||n<0||n>mx2){t.classList.add('bad');toast(n>mx2?`⚠ พิมพ์คะแนนเกินคะแนนเต็ม (${raw}) · คะแนนเต็มของช่องนี้คือ ${mx2} คะแนน · ระบบยังไม่บันทึกค่านี้`:`⚠ คะแนนต้องเป็นตัวเลข 0–${mx2} · ระบบยังไม่บันทึกค่านี้`);return}
 S[i][j]=n;t.className=sc(n,mx2);$('#t'+i).textContent=tot(i,term);save()});
m.addEventListener('change',e=>{const t=e.target;if(!t.dataset.j||!t.classList.contains('bad'))return;const j=+t.dataset.j,v=S[+t.dataset.i][j];t.value=v??'';t.className=sc(v,+IN[j].m||10)});
function rsm(){
 const n=D.st.length,g={4:0,3.5:0,3:0,2.5:0,2:0,1.5:0,1:0,0:0};let ps=0,sum=0,done=0;
 D.st.forEach((_,i)=>{const p=pct(i);g[gr(p)]++;if(p>=50)ps++;sum+=p;if(cnt(i)==IN.length)done++});
 const mx=Math.max(...Object.values(g),1);
 m.innerHTML=`<div class="cards"><div class="card"><b>${n}</b><span>นักเรียนทั้งหมด</span></div><div class="card"><b class="p">${ps}</b><span>ผ่านเกณฑ์ (≥ 50%)</span></div><div class="card"><b class="f">${n-ps}</b><span>ไม่ผ่านเกณฑ์</span></div><div class="card"><b>${(sum/n).toFixed(1)}%</b><span>คะแนนเฉลี่ยร้อยละ</span></div><div class="card"><b>${done}/${n}</b><span>บันทึกคะแนนครบทุกตัวชี้วัด</span></div></div>
 <b>การกระจายระดับผลการเรียน</b><div class="dist">${Object.keys(g).reverse().map(k=>`<div>${g[k]}<i style="height:${g[k]/mx*90}px;background:${GC[k]}"></i>เกรด ${k}</div>`).join('')}</div>
 <div class="wrap"><table><thead><tr><th class="nm">ชื่อ-สกุล</th><th>ภาค 1<div class="t">เต็ม ${mxs(1)}</div></th><th>ภาค 2<div class="t">เต็ม ${mxs(2)}</div></th><th>รวม<div class="t">เต็ม ${MAX}</div></th><th>ร้อยละ</th><th>เกรด</th><th>ผล</th><th>กรอกแล้ว</th></tr></thead><tbody>${D.st.map((s,i)=>{const p=pct(i);return`<tr><td class="nm"><span class="mu">${i+1}</span> ${s[1]}</td><td>${tot(i,1)}</td><td>${tot(i,2)}</td><td>${tot(i,0)}</td><td><div class="pb"><i style="width:${Math.min(100,p)}%;background:${p>=50?'var(--ok)':'var(--no)'}"></i></div>${p.toFixed(1)}</td><td>${gch(gr(p))}</td><td class="${p>=50?'p':'f'}">${p>=50?'ผ่าน':'ไม่ผ่าน'}</td><td class="mu">${cnt(i)}/${IN.length}</td></tr>`}).join('')}</tbody></table></div>

function readScores(rows){const hr=rows.findIndex(r=>r.some(c=>String(c).includes('เลขประจำตัวนักเรียน'))),nr=rows.findIndex(r=>String(r[0]).trim()=='ลำดับตัวชี้วัด');if(hr<0||nr<0)return null;
